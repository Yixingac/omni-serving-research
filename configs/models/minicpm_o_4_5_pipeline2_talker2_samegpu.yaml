# 只用于功能测试（Spark，1 张 GPU）：thinker 所在的 pipeline 进程和 talker 进程各复制两份，都放在 GPU 0，
# 检查“thinker 池 + talker 池”这种布局在运行时能否工作。不用于性能比较。
config_cls: MiniCPMOSpeechPipelineConfig
# --config 文件会先按完整配置校验，model_path 是必填项；启动时传入的 --model-path 会覆盖这里的值。
model_path: openbmb/MiniCPM-o-4_5

# 同卡副本必须为这张卡上每个 GPU 阶段声明显存比例，合计不超过 1.0。GB10 约 120 GiB 统一内存：
# GPU 0 合计 2 × (0.01 + 0.02 + 0.02 + 0.18) + 2 × (0.05 + 0.08) = 0.72。
stages:
  preprocessing:
    gpu_memory_fraction: 0.01
  audio_encoder:
    gpu_memory_fraction: 0.02
  image_encoder:
    gpu_memory_fraction: 0.02
  thinker:
    gpu_memory_fraction: 0.18
  talker:
    gpu_memory_fraction: 0.05
  code2wav:
    gpu_memory_fraction: 0.08

processes:
  pipeline:
    num_replicas: 2
    replica_devices: [0, 0]
  talker:
    num_replicas: 2
    replica_devices: [0, 0]
